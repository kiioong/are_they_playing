version: '3'

tasks:
  generate:
    cmds:
      - buf generate
  run:
    cmds:
      - task: run-backend
      - task: run-frontend
  run-backend:
    cmds:
      - GOFLAGS="-mod=mod" go build -C backend internal/server.go
      - ./backend/server
  run-frontend:
    dir: frontend
    cmds:
      - ionic serve
  build-frontend:
    dir: frontend
    cmds:
      - ionic build
      - ionic cap copy
      - ionic cap sync
  lint-frontend:
    cmds:
      - docker compose exec ionic-gui yarn lint
  lint-data_grabber:
    cmds:
      - docker compose exec python_service pylint .
  lint:
    cmds:
      - task: lint-frontend
      - task: lint-data_grabber
    ignore_error: true
